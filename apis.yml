aid: parallel-finance
name: Parallel Finance
description: >-
  Parallel Finance is a decentralized money-market protocol built on the Polkadot
  ecosystem, offering lending, staking, and borrowing where depositors can lend and
  stake simultaneously to earn combined yield and borrowers can post collateral to
  borrow. It runs as a Substrate/Polkadot parachain (Parallel mainnet and the Heiko
  canary network on Kusama). Rather than a REST API, developers integrate through a
  JSON-RPC node over WebSocket (wss://rpc.parallel.fi) using polkadot.js, aided by
  Parallel's first-party @parallel-finance TypeScript SDK packages on npm that supply
  the chain types, RPC definitions, and connection options. Source, chain specs, and
  the auction toolkit are published under the parallel-finance GitHub organization.
